<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSC300L | Student Records Management System</title>

  <!-- Google Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Space+Grotesk:wght@500;700&display=swap"
    rel="stylesheet">
  <!-- Font Awesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --primary: #2563eb;
      --secondary: #64748b;
      --accent: #f59e0b;
      --success: #10b981;
      --danger: #ef4444;
      --dark: #0f172a;
      --light: #f8fafc;
      --white: #ffffff;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #f1f5f9;
      color: var(--dark);
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 1100px;
    }

    /* ASSIGNMENT HEADER */
    .portal-header {
      text-align: center;
      margin-bottom: 50px;
    }

    .dept-tag {
      background: var(--primary);
      color: white;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      display: inline-block;
      margin-bottom: 15px;
    }

    .portal-header h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2.5rem;
      margin: 0;
      color: var(--dark);
      letter-spacing: -1px;
    }

    .portal-header p {
      color: var(--secondary);
      margin-top: 10px;
      font-size: 1.1rem;
    }

    /* MAIN LAYOUT: FORM & TABLE */
    .grid-layout {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 30px;
      align-items: start;
    }

    /* FORM CARD */
    .form-card {
      background: var(--white);
      padding: 30px;
      border-radius: 24px;
      box-shadow: var(--shadow);
      position: sticky;
      top: 40px;
    }

    .form-card h3 {
      margin-top: 0;
      margin-bottom: 25px;
      font-size: 1.25rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--secondary);
      text-transform: uppercase;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    select {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.95rem;
      transition: var(--transition);
      box-sizing: border-box;
    }

    input:focus,
    select:focus {
      border-color: var(--primary);
      outline: none;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
    }

    .input-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    /* CUSTOM RADIO & CHECKBOX */
    .selection-group {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      margin-top: 5px;
    }

    .custom-option {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }

    .custom-option input {
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
    }

    .btn-submit {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 16px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 10px;
    }

    .btn-submit:hover {
      background: var(--dark);
      transform: translateY(-2px);
    }

    /* TABLE AREA */
    .table-area {
      background: var(--white);
      border-radius: 24px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .table-header {
      padding: 25px 30px;
      border-bottom: 1px solid #f1f5f9;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .table-header h2 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 800;
    }

    .record-count {
      background: #eff6ff;
      color: var(--primary);
      padding: 4px 12px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .table-responsive {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      background: #f8fafc;
      padding: 18px 20px;
      text-align: left;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--secondary);
      letter-spacing: 1px;
    }

    td {
      padding: 18px 20px;
      border-bottom: 1px solid #f1f5f9;
      font-size: 0.9rem;
      color: #334155;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover {
      background-color: #f8fafc;
    }

    /* STATUS BADGES */
    .badge {
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .badge-success {
      background: #dcfce7;
      color: #166534;
    }

    .badge-danger {
      background: #fee2e2;
      color: #991b1b;
    }

    .payment-tag {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      color: var(--secondary);
    }

    /* RESPONSIVE */
    @media (max-width: 992px) {
      .grid-layout {
        grid-template-columns: 1fr;
      }

      .form-card {
        position: static;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <!-- Assignment Header -->
    <header class="portal-header">
      <span class="dept-tag">Computer Science Dept</span>
      <h1>CSC300L Course Management</h1>
      <p>Student Enrollment & Data Simulation System</p>
    </header>

    <div class="grid-layout">
      <!-- Form Card -->
      <section class="form-card">
        <h3><i class="fa-solid fa-file-signature" style="color: var(--primary)"></i> Register Student</h3>
        <form id="schoolForm">
          <div class="form-group">
            <label>Full Name</label>
            <input id="fullname" type="text" placeholder="e.g. Umar Lawal" required />
          </div>

          <div class="form-group">
            <label>University / School</label>
            <input id="school" type="text" placeholder="e.g. ATBU" required />
          </div>

          <div class="input-row">
            <div class="form-group">
              <label>Level</label>
              <select id="level">
                <option value="100L">100L</option>
                <option value="200L">200L</option>
                <option value="300L" selected>300L</option>
                <option value="400L">400L</option>
                <option value="500L">500L</option>
              </select>
            </div>
            <div class="form-group">
              <label>Payment</label>
              <div class="selection-group">
                <label class="custom-option">
                  <input type="radio" name="paymentMethod" value="Cash" checked> Cash
                </label>
                <label class="custom-option">
                  <input type="radio" name="paymentMethod" value="Card"> Card
                </label>
              </div>
            </div>
          </div>

          <div class="form-group">
            <label>Email Address</label>
            <input id="email" type="email" placeholder="umarlawal@gmail.com" required />
          </div>

          <div class="form-group">
            <label>Portal Password</label>
            <input id="password" type="password" placeholder="••••••••" required />
          </div>

          <div class="form-group">
            <label class="custom-option">
              <input id="terms" type="checkbox" />
              <span>I agree to course terms</span>
            </label>
          </div>

          <button id="submidButton" type="button" class="btn-submit">
            <i class="fa-solid fa-user-plus"></i> Add to Registry
          </button>
        </form>
      </section>

      <!-- Table Area -->
      <section class="table-area">
        <div class="table-header">
          <h2>Registered Students</h2>
          <span class="record-count" id="countDisplay">0 Records</span>
        </div>
        <div class="table-responsive">
          <table id="schoolTable">
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Details</th>
                <th>Contact</th>
                <th>T&C</th>
                <th>Payment</th>
              </tr>
            </thead>
            <tbody id="tableBody">
              <!-- Dynamic rows go here -->
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </div>

  <script>
    let studentCount = 0;
const btn = document.getElementById("submidButton");
const tableBody = document.getElementById("tableBody");
const countDisplay = document.getElementById("countDisplay");

// Use relative URL so it works seamlessly both on localhost and when hosted online
const API_URL = '/api/students';

// Fetch existing data from backend on page load
async function loadStudents() {
  try {
    const response = await fetch(API_URL);
    const students = await response.json();
    tableBody.innerHTML = ''; // Clear table
    studentCount = 0;

    students.forEach(student => {
      appendRowToTable(student);
    });
  } catch (error) {
    console.error("Error loading students:", error);
  }
}

// Separate helper to build UI table rows
function appendRowToTable(student) {
  studentCount = student.idNumber || (studentCount + 1);
  const row = document.createElement("tr");

  const termBadge = student.terms ?
    '<span class="badge badge-success">Accepted</span>' :
    '<span class="badge badge-danger">Pending</span>';

  const payIcon = student.paymentMethod === "Card" ? "fa-credit-card" : "fa-money-bill-wave";

  row.innerHTML = `
    <td><span style="font-weight: 800; color: var(--primary);">#${studentCount}</span></td>
    <td>
        <div style="font-weight: 700;">${student.fullname}</div>
        <div style="font-size: 0.75rem; color: var(--secondary);">${student.email}</div>
    </td>
    <td>
        <div style="font-weight: 600;">${student.school}</div>
        <div style="font-size: 0.8rem;">Year: ${student.level}</div>
    </td>
    <td><button style="background:none; border:1px solid #ddd; padding:4px 8px; border-radius:6px; font-size:12px; cursor:pointer;"><i class="fa-solid fa-envelope"></i> Message</button></td>
    <td>${termBadge}</td>
    <td>
        <div class="payment-tag">
            <i class="fa-solid ${payIcon}"></i> ${student.paymentMethod}
        </div>
    </td>
  `;
  tableBody.appendChild(row);
  countDisplay.innerText = `${studentCount} Record${studentCount > 1 ? 's' : ''}`;
}

// Send data to backend when form is submitted
async function addStudentRecord() {
  const fullname = document.getElementById("fullname").value;
  const school = document.getElementById("school").value;
  const level = document.getElementById("level").value;
  const email = document.getElementById("email").value;
  const terms = document.getElementById("terms").checked;
  const paymentMethod = document.querySelector('input[name="paymentMethod"]:checked').value;

  if (!fullname || !email || !school) {
    alert("Please fill all required student information.");
    return;
  }

  const studentData = { fullname, school, level, email, terms, paymentMethod };

  try {
    const response = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(studentData)
    });

    if (response.ok) {
      const savedStudent = await response.json();
      appendRowToTable(savedStudent); // Append the official record
      
      // Reset Form
      document.getElementById("schoolForm").reset();
      document.getElementById("level").value = "300L";
    } else {
      alert("Error saving record to the server.");
    }
  } catch (error) {
    console.error("Network error:", error);
  }
}

btn.addEventListener("click", addStudentRecord);
window.addEventListener("DOMContentLoaded", loadStudents); // Load records on start
  </script>
</body>

</html>
